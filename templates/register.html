<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up — Cyber Academy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0b0d12; color: #e8eaed; line-height: 1.6;
         min-height: 100vh; display: flex; flex-direction: column; }
  nav { padding: 18px 40px; border-bottom: 1px solid #1e222b; }
  .logo { font-weight: 700; font-size: 20px; letter-spacing: -.3px; }
  .logo span { color: #5b8cff; }
  .wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .auth-card { width: 100%; max-width: 380px; background: #141821; border: 1px solid #1e222b;
    border-radius: 14px; padding: 34px 30px; }
  .auth-card h1 { font-size: 24px; letter-spacing: -.4px; margin-bottom: 6px; }
  .auth-card .sub { color: #9aa3b2; font-size: 14px; margin-bottom: 26px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 13px; color: #9aa3b2; margin-bottom: 6px; }
  .field input { width: 100%; padding: 11px 14px; background: #0b0d12; border: 1px solid #1e222b;
    border-radius: 8px; color: #e8eaed; font-size: 15px; font-family: inherit; }
  .field input:focus { outline: none; border-color: #5b8cff; }
  .btn { width: 100%; background: #5b8cff; color: #fff; border: none; padding: 13px;
    border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 6px;
    transition: background .15s, transform .15s; }
  .btn:hover { background: #4574e8; transform: translateY(-1px); }
  .foot { margin-top: 22px; text-align: center; font-size: 14px; color: #9aa3b2; }
  .foot a { color: #5b8cff; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
  .flash { list-style: none; margin-bottom: 20px; }
  .flash li { padding: 11px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
  .flash li.error { background: #2a1418; color: #ff8f9c; border: 1px solid #4a1f27; }
  .flash li.success { background: #10261c; color: #6fe3a0; border: 1px solid #1e4230; }
</style>
</head>
<body>
<nav><div class="logo">Cyber<span>Academy</span></div></nav>
<div class="wrap">
  <div class="auth-card">
    <h1>Create your account</h1>
    <p class="sub">Start your security training track.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <ul class="flash">
        {% for category, message in messages %}
        <li class="{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autofocus>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
      </div>
      <div class="field">
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" name="confirm" minlength="8" required>
      </div>
      <button class="btn" type="submit">Sign up</button>
    </form>

    <p class="foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
</body>
</html>
